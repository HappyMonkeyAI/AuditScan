name: External Content Gate
on:
  pull_request:
  push:
permissions:
  contents: read
  security-events: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        run: python -m pip install uv
      - name: Run external-content audit
        run: |
          mkdir -p audit-artifacts
          uv run --extra dev repo-audit-scan scan . --profile external_repo --format json --output-root audit-artifacts > audit-artifacts/result.json
      - name: Enforce assessment disposition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from repo_audit_scan.ci_policy import enforce_disposition
          result = json.loads(Path("audit-artifacts/result.json").read_text())
          enforce_disposition(result.get("assessment", {}).get("disposition"))
          PY
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: external-content-audit
          path: audit-artifacts/
